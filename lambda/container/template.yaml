AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
    # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    # docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html
    # docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-resource-function--examples
    # docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-inlinecode
    # docs.aws.amazon.com/serverless-application-model/latest/developerguide/install-sam-cli.html
    #  ../  = upper directory,  ./ current directory
  InlineLambda:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../ 
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Handler: function.handler
      Runtime: python3.12