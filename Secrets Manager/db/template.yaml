AWSTemplateFormatVersion: "2010-09-09"
Parameters:
Resources:
  MySecret:
    # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-res
    Type: 'AWS::SecretsManager::Secret'
    Properties:
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-p
      GenerateSecretString:
        SecretStringTemplate: '{"username": "test-user"}'
        GenerateStringKey: "password"
        PasswordLength: 30
        ExcludeCharacters: '"@/\'
  DbAttachment:
    # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-res
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId:
        Ref: MySecret
      TargetId:
        Ref: MyRedshiftCluster
      TargetType: AWS::RDS::DBIntance